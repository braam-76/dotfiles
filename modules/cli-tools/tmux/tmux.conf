# Leader: Ctrl+Space. Press it twice to send Ctrl+Space to the application.
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Preserve modified keys (for example, Shift+Enter).
set -g extended-keys on
set -g extended-keys-format csi-u

# Split in the current pane's working directory.
unbind '"'
unbind %
bind v split-window -h -c '#{pane_current_path}'
bind h split-window -v -c '#{pane_current_path}'

# Use leader + arrow keys to move between panes.
bind Left select-pane -L
bind Down select-pane -D
bind Up select-pane -U
bind Right select-pane -R

# Reload the generated configuration, including the Stylix theme.
bind r source-file ~/.tmux.conf \; display-message 'tmux config reloaded'
