# More option see https://github.com/DreamMaoMao/mango/wiki/

# Wallpaper daemon (restores the last wallpaper from its cache).
exec_once=awww-daemon

# Display scaling
monitor_rule=name:^eDP-1$,scale:1.5

# Window effect
blur=0
blur_layer=0
blur_optimized=1
blur_params_num_passes = 2
blur_params_radius = 5
blur_params_noise = 0.02
blur_params_brightness = 0.9
blur_params_contrast = 0.9
blur_params_saturation = 1.2

shadows = 0
layer_shadows = 0
shadow_only_floating = 1
shadows_size = 10
shadows_blur = 15
shadows_position_x = 0
shadows_position_y = 0

border_radius=6
no_radius_when_single=0
focused_opacity=1.0
unfocused_opacity=1.0

dim_enable=0

# Animation Configuration(support type:zoom,slide)
# tag_animation_direction: 1-horizontal,0-vertical
animations=1
layer_animations=1
animation_type_open=slide
animation_type_close=slide
animation_fade_in=1
animation_fade_out=1
tag_animation_direction=1
zoom_initial_ratio=0.4
zoom_end_ratio=0.8
fade_in_begin_opacity=0.5
fade_out_begin_opacity=0.8
animation_duration_move=500
animation_duration_open=400
animation_duration_tag=350
animation_duration_close=800
animation_duration_focus=0
animation_curve_open=0.46,1.0,0.29,1
animation_curve_move=0.46,1.0,0.29,1
animation_curve_tag=0.46,1.0,0.29,1
animation_curve_close=0.08,0.92,0,1
animation_curve_focus=0.46,1.0,0.29,1
animation_curve_opacity_fade_out=0.5,0.5,0.5,0.5
animation_curve_opacity_fade_in=0.46,1.0,0.29,1

# Scroller Layout Setting
scroller_structs=20
scroller_default_proportion=0.8
scroller_focus_center=0
scroller_prefer_center=0
edge_scroller_pointer_focus=1
edge_scroller_focus_allow_speed=0.0
scroller_default_proportion_single=1.0
scroller_proportion_preset=0.5,0.8,1.0

# Master-Stack Layout Setting
new_is_master=1
default_master_factor=0.55
default_master_count=1
tag_num=10
smart_gaps=0

# Dwindle Layout Setting
dwindle_smart_split=0
dwindle_drop_simple_split=1
dwindle_manual_split=0
dwindle_horizontal_split=1
dwindle_vertical_split=1
dwindle_preserve_split=0

# Monocle Layout Setting
monocle_tab_mode=1
monocle_no_border=0
monocle_no_gap=0
monocle_no_radius=0

# Deck Layout Setting
deck_tab_mode=1

# Overview Setting
hotarea_size=10
enable_hotarea=0
hotarea_disable_on_fullscreen=1
overview_gap_inner=5
overview_gap_outer=30
overcircle_center_ratio=0.5
title_message_bar_height=52
title_message_bar_gap=20

# Misc
no_border_when_single=0
axis_bind_apply_timeout=100
focus_on_activate=1
idle_inhibit_ignore_visible=0
idle_inhibit_when_fullscreen=0
sloppy_focus=1
warp_cursor=0
focus_cross_monitor=0
focus_direction_only_zone_overlap=1
focus_cross_tag=0
enable_floating_snap=0
snap_distance=30
float_full_to_top=0
cursor_size=24
drag_tile_to_tile=1
drag_tile_small=1

# keyboard
repeat_rate=40
repeat_delay=250
numlock_on=1
xkb_rules_layout=us,ru
xkb_rules_variant=,
xkb_rules_options=compose:caps,shift:both_capslock_cancel,grp:win_space_toggle

# Trackpad
# need relogin to make it apply
disable_trackpad=0
tap_to_click=1
tap_and_drag=1
drag_lock=1
trackpad_natural_scrolling=1
trackpad_disable_while_typing=1
trackpad_left_handed=0
trackpad_middle_button_emulation=0
swipe_min_threshold=1

# mouse
# need relogin to make it apply
mouse_natural_scrolling=0

# Appearance
gap_inner_horizontal=5
gap_inner_vertical=5
gap_outer_horizontal=10
gap_outer_vertical=10
scratchpad_width_ratio=0.8
scratchpad_height_ratio=0.9
border_px=4
# Generated by Stylix through Home Manager; keep colors out of this file.
source=~/.config/mango/colors.conf

# layout support:
# tile,scroller,grid,deck,monocle,center_tile,vertical_tile,vertical_scroller
tag_rule=id:1,layout_name:scroller
tag_rule=id:2,layout_name:scroller
tag_rule=id:3,layout_name:scroller
tag_rule=id:4,layout_name:scroller
tag_rule=id:5,layout_name:scroller
tag_rule=id:6,layout_name:scroller
tag_rule=id:7,layout_name:scroller
tag_rule=id:8,layout_name:scroller
tag_rule=id:9,layout_name:scroller
tag_rule=id:10,layout_name:scroller

# Key Bindings — ported from Omarchy-Keybindings.md
# Plain Super+W is deliberately unbound. Super+Space is handled by XKB.
# bind uses physical keys by default; explicit code:N keeps number/punctuation positions.
# Omarchy/Hyprland-only actions are recorded below as unbound, not executable Lua.
# Applications use this NixOS setup: Fuzzel, Alacritty, Firefox, Neovim and Mako.
# No session-wide Enter/Tab/arrows for the temporary Omarchy screenshot picker.

# Focus on next window
bind=ALT,Tab,focusstack,next
# Volume down precise
bindl=ALT,XF86AudioLowerVolume,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 1%-
# Volume up precise
bindl=ALT,XF86AudioRaiseVolume,spawn,wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 1%+
# Focus on next monitor
bind=CTRL+ALT,Tab,focusmon,next
# Focus on previous window
bind=SHIFT+ALT,Tab,focusstack,prev
# Focus on previous monitor
bind=SHIFT+CTRL+ALT,Tab,focusmon,prev
# Switch to workspace 10
bind=SUPER,code:19,view,10,0
# Switch to workspace 1
bind=SUPER,code:10,view,1,0
# Switch to workspace 2
bind=SUPER,code:11,view,2,0
# Switch to workspace 3
bind=SUPER,code:12,view,3,0
# Switch to workspace 4
bind=SUPER,code:13,view,4,0
# Switch to workspace 5
bind=SUPER,code:14,view,5,0
# Switch to workspace 6
bind=SUPER,code:15,view,6,0
# Switch to workspace 7
bind=SUPER,code:16,view,7,0
# Switch to workspace 8
bind=SUPER,code:17,view,8,0
# Switch to workspace 9
bind=SUPER,code:18,view,9,0
# Dismiss last notification
bind=SUPER,comma,spawn,makoctl dismiss
# Omarchy menu
bind=SUPER,d,spawn,fuzzel
# Focus on below window
bind=SUPER,Down,focusdir,down
# Log out of Mango
bind=SUPER,Escape,quit
# Shrink window left
bind=SUPER,code:21,resizewin,+100,+0
# Toggle maximized window
bind=SUPER,f,togglemaximizescreen
# Toggle window split (Mango dwindle layout only)
bind=SUPER,j,dwindle_toggle_current_split
# Toggle workspace layout (cycles Mango layouts)
bind=SUPER,l,switch_layout
# Focus on left window
bind=SUPER,Left,focusdir,left
# Move window
mousebind=SUPER,btn_left,moveresize,curmove
# Expand window left
bind=SUPER,code:20,resizewin,-100,+0
# Scroll through windows in the current workspace
axisbind=SUPER,DOWN,focusdir,right
axisbind=SUPER,UP,focusdir,left
# Close window
bind=SUPER,q,killclient
# Terminal
bind=SUPER,Return,spawn,alacritty
# Focus on right window
bind=SUPER,Right,focusdir,right
# Resize window
mousebind=SUPER,btn_right,moveresize,curresize
# Toggle scratchpad
bind=SUPER,s,toggle_special_tag
# Toggle window floating/tiling
bind=SUPER,t,togglefloating
# Next workspace
bind=SUPER,Tab,viewtoright,0
# Focus on above window
bind=SUPER,Up,focusdir,up
# Invoke last notification
bind=SUPER+ALT,comma,spawn,makoctl invoke
# Move window to group on bottom
bind=SUPER+ALT,Down,groupjoin,down
# Shrink window left a little
bind=SUPER+ALT,code:21,resizewin,+25,+0
# Move active window out of group
bind=SUPER+ALT,g,groupleave
# Move window to group on left
bind=SUPER+ALT,Left,groupjoin,left
# Expand window left a little
bind=SUPER+ALT,code:20,resizewin,-25,+0
# Next window in group
axisbind=SUPER+ALT,DOWN,groupfocus,next
# Previous window in group
axisbind=SUPER+ALT,UP,groupfocus,prev
# Move window to group on right
bind=SUPER+ALT,Right,groupjoin,right
# Move window to scratchpad
bind=SUPER+ALT,s,tag_special_silent
# Next window in group
bind=SUPER+ALT,Tab,groupfocus,next
# Move window to group on top
bind=SUPER+ALT,Up,groupjoin,up
# Toggle silencing notifications
bind=SUPER+CTRL,comma,spawn,makoctl mode -t do-not-disturb
# Shrink window left a lot
bind=SUPER+CTRL,code:21,resizewin,+300,+0
# Move grouped window focus left
bind=SUPER+CTRL,Left,groupfocus,prev
# Expand window left a lot
bind=SUPER+CTRL,code:20,resizewin,-300,+0
# Move grouped window focus right
bind=SUPER+CTRL,Right,groupfocus,next
# Former workspace
bind=SUPER+CTRL,Tab,view,0,0
# Move window to workspace 10
bind=SUPER+SHIFT,code:19,tag,10,0
# Move window to workspace 1
bind=SUPER+SHIFT,code:10,tag,1,0
# Move window to workspace 2
bind=SUPER+SHIFT,code:11,tag,2,0
# Move window to workspace 3
bind=SUPER+SHIFT,code:12,tag,3,0
# Move window to workspace 4
bind=SUPER+SHIFT,code:13,tag,4,0
# Move window to workspace 5
bind=SUPER+SHIFT,code:14,tag,5,0
# Move window to workspace 6
bind=SUPER+SHIFT,code:15,tag,6,0
# Move window to workspace 7
bind=SUPER+SHIFT,code:16,tag,7,0
# Move window to workspace 8
bind=SUPER+SHIFT,code:17,tag,8,0
# Move window to workspace 9
bind=SUPER+SHIFT,code:18,tag,9,0
# ChatGPT
bind=SUPER+SHIFT,a,spawn,firefox "https://chatgpt.com"
# Browser
bind=SUPER+SHIFT,b,spawn,firefox
# Toggle window gaps
bind=SUPER+SHIFT,BackSpace,togglegaps
# Calendar
bind=SUPER+SHIFT,c,spawn,firefox "https://app.hey.com/calendar/weeks/"
# Dismiss all notifications
bind=SUPER+SHIFT,comma,spawn,makoctl dismiss --all
# Swap window down
bind=SUPER+SHIFT,Down,exchange_client,down
# Email
bind=SUPER+SHIFT,e,spawn,firefox "https://app.hey.com"
# Expand window down
bind=SUPER+SHIFT,code:21,resizewin,+0,+100
# File manager
bind=SUPER+SHIFT,f,spawn,xdg-open .
# Swap window to the left
bind=SUPER+SHIFT,Left,exchange_client,left
# Shrink window up
bind=SUPER+SHIFT,code:20,resizewin,+0,-100
# Editor
bind=SUPER+SHIFT,n,spawn,alacritty -e nvim
# Google Photos
bind=SUPER+SHIFT,p,spawn,firefox "https://photos.google.com/"
# Browser
bind=SUPER+SHIFT,Return,spawn,firefox
# Swap window to the right
bind=SUPER+SHIFT,Right,exchange_client,right
# Google Maps
bind=SUPER+SHIFT,s,spawn,firefox "https://maps.google.com/"
# Toggle top bar
bind=SUPER+SHIFT,space,spawn,pkill -SIGUSR1 waybar
# Previous workspace
bind=SUPER+SHIFT,Tab,viewtoleft,0
# Swap window up
bind=SUPER+SHIFT,Up,exchange_client,up
# X
bind=SUPER+SHIFT,x,spawn,firefox "https://x.com/"
# YouTube
bind=SUPER+SHIFT,y,spawn,firefox "https://youtube.com/"
# Move window silently to workspace 10
bind=SUPER+SHIFT+ALT,code:19,tagsilent,10
# Move window silently to workspace 1
bind=SUPER+SHIFT+ALT,code:10,tagsilent,1
# Move window silently to workspace 2
bind=SUPER+SHIFT+ALT,code:11,tagsilent,2
# Move window silently to workspace 3
bind=SUPER+SHIFT+ALT,code:12,tagsilent,3
# Move window silently to workspace 4
bind=SUPER+SHIFT+ALT,code:13,tagsilent,4
# Move window silently to workspace 5
bind=SUPER+SHIFT+ALT,code:14,tagsilent,5
# Move window silently to workspace 6
bind=SUPER+SHIFT+ALT,code:15,tagsilent,6
# Move window silently to workspace 7
bind=SUPER+SHIFT+ALT,code:16,tagsilent,7
# Move window silently to workspace 8
bind=SUPER+SHIFT+ALT,code:17,tagsilent,8
# Move window silently to workspace 9
bind=SUPER+SHIFT+ALT,code:18,tagsilent,9
# Grok
bind=SUPER+SHIFT+ALT,a,spawn,firefox "https://grok.com"
# Browser (private)
bind=SUPER+SHIFT+ALT,b,spawn,firefox --private-window
# New email
bind=SUPER+SHIFT+ALT,e,spawn,firefox "https://app.hey.com/messages/new?display=standalone&new_window=true"
# Expand window down a little
bind=SUPER+SHIFT+ALT,code:21,resizewin,+0,+25
# WhatsApp
bind=SUPER+SHIFT+ALT,g,spawn,firefox "https://web.whatsapp.com/"
# Shrink window up a little
bind=SUPER+SHIFT+ALT,code:20,resizewin,+0,-25
# Previous window in group
bind=SUPER+SHIFT+ALT,Tab,groupfocus,prev
# X Post
bind=SUPER+SHIFT+ALT,x,spawn,firefox "https://x.com/compose/post"
# Expand window down a lot
bind=SUPER+SHIFT+CTRL,code:21,resizewin,+0,+300
# Google Messages
bind=SUPER+SHIFT+CTRL,g,spawn,firefox "https://messages.google.com/web/conversations"
# Shrink window up a lot
bind=SUPER+SHIFT+CTRL,code:20,resizewin,+0,-300
# Volume down
bindl=NONE,XF86AudioLowerVolume,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
# Mute microphone
bindl=NONE,XF86AudioMicMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
# Mute
bindl=NONE,XF86AudioMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
# Volume up
bindl=NONE,XF86AudioRaiseVolume,spawn,wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
# Toggle touchpad
bindl=NONE,XF86TouchpadToggle,toggle_trackpad_enable

# Mango maintenance shortcut (additional to the reference)
bind=SUPER+SHIFT,r,reload_config

# Unported reference actions
# These need Omarchy services, extra applications/scripts, or compositor support.
# Group membership uses Super+Alt+arrows / Super+Alt+G; no direct group toggle/index.
# Universal copy/paste needs focused-app detection and modifier-safe key injection.
# Capture picker bindings must remain scoped to a picker, never global.
# Lid handling belongs to logind/power management on this NixOS setup.
# Unbound: ALT + PRINT — Screenrecording
# Unbound: ALT + XF86AudioPlay — Next track
# Unbound: ALT + XF86MonBrightnessDown — Brightness down precise
# Unbound: ALT + XF86MonBrightnessUp — Brightness up precise
# Unbound: CTRL ALT + DELETE — Close all windows
# Unbound: F9 — Start dictation (push-to-talk)
# Unbound: PRINT — Screenshot
# Unbound: SHIFT + XF86AudioMute — Switch audio output
# Unbound: SHIFT + XF86AudioPause — Switch media source
# Unbound: SHIFT + XF86AudioPlay — Switch media source
# Unbound: SHIFT + XF86MonBrightnessDown — Brightness minimum
# Unbound: SHIFT + XF86MonBrightnessUp — Brightness maximum
# Unbound: SHIFT ALT + XF86AudioPlay — Previous track
# Unbound: SUPER + BACKSPACE — Toggle window transparency
# Unbound: SUPER + C — Universal copy
# Unbound: SUPER + G — Toggle window grouping
# Unbound: SUPER + Home — Restore window width
# Unbound: SUPER + K — Keybindings
# Unbound: SUPER + O — Pop window out (float & pin)
# Unbound: SUPER + P — Pseudo window
# Unbound: SUPER + PRINT — Color picker
# Unbound: SUPER + SLASH — Monitor scaling up
# Unbound: SUPER + V — Universal paste
# Unbound: SUPER + X — Universal cut
# Unbound: SUPER ALT + 1 — Switch to group window 1
# Unbound: SUPER ALT + 2 — Switch to group window 2
# Unbound: SUPER ALT + 3 — Switch to group window 3
# Unbound: SUPER ALT + 4 — Switch to group window 4
# Unbound: SUPER ALT + 5 — Switch to group window 5
# Unbound: SUPER ALT + BRACKETLEFT — Make webcam overlay smaller
# Unbound: SUPER ALT + BRACKETRIGHT — Make webcam overlay larger
# Unbound: SUPER ALT + F — Full width
# Unbound: SUPER ALT + Home — Save window width
# Unbound: SUPER ALT + K — Tmux keybindings
# Unbound: SUPER ALT + RETURN — Tmux
# Unbound: SUPER ALT + SLASH — Monitor scaling down
# Unbound: SUPER ALT + SPACE — Apps menu
# Unbound: SUPER CTRL + 1 — Bar panel 1
# Unbound: SUPER CTRL + 2 — Bar panel 2
# Unbound: SUPER CTRL + 3 — Bar panel 3
# Unbound: SUPER CTRL + 4 — Bar panel 4
# Unbound: SUPER CTRL + 5 — Bar panel 5
# Unbound: SUPER CTRL + 6 — Bar panel 6
# Unbound: SUPER CTRL + 7 — Bar panel 7
# Unbound: SUPER CTRL + 8 — Bar panel 8
# Unbound: SUPER CTRL + 9 — Bar panel 9
# Unbound: SUPER CTRL + A — Audio
# Unbound: SUPER CTRL + B — Bluetooth
# Unbound: SUPER CTRL + BACKSPACE — Toggle single-window square aspect
# Unbound: SUPER CTRL + C — Capture menu
# Unbound: SUPER CTRL + D — Display
# Unbound: SUPER CTRL + Delete — Toggle laptop display
# Unbound: SUPER CTRL + E — Emojis
# Unbound: SUPER CTRL + F — Tiled full screen
# Unbound: SUPER CTRL + H — Hardware menu
# Unbound: SUPER CTRL + I — Toggle locking on idle
# Unbound: SUPER CTRL + K — Herdr keybindings
# Unbound: SUPER CTRL + L — Lock system
# Unbound: SUPER CTRL + N — Toggle nightlight
# Unbound: SUPER CTRL + O — Toggle menu
# Unbound: SUPER CTRL + P — Power
# Unbound: SUPER CTRL + PERIOD — Transcode
# Unbound: SUPER CTRL + PRINT — Extract text (OCR) from screenshot
# Unbound: SUPER CTRL + Q — Calculator
# Unbound: SUPER CTRL + R — Set reminder
# Unbound: SUPER CTRL + RETURN — Herdr
# Unbound: SUPER CTRL + S — Share
# Unbound: SUPER CTRL + SPACE — Background switcher
# Unbound: SUPER CTRL + T — Activity
# Unbound: SUPER CTRL + V — Clipboard manager
# Unbound: SUPER CTRL + W — Network
# Unbound: SUPER CTRL + X — Toggle dictation
# Unbound: SUPER CTRL + Z — Zoom in
# Unbound: SUPER CTRL ALT + B — Show battery remaining
# Unbound: SUPER CTRL ALT + D — Calendar
# Unbound: SUPER CTRL ALT + Delete — Toggle laptop display mirroring
# Unbound: SUPER CTRL ALT + R — Show reminders
