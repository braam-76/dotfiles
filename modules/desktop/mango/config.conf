# Wallpaper
exec_once=awww-daemon

# Display scaling
monitor_rule=name:^eDP-1$,scale:1.5

# Window effect
blur=0
blur_layer=0
blur_optimized=1
blur_params_num_passes = 2
blur_params_radius = 5
blur_params_noise = 0.02
blur_params_brightness = 0.9
blur_params_contrast = 0.9
blur_params_saturation = 1.2

shadows = 0
layer_shadows = 0
shadow_only_floating = 1
shadows_size = 10
shadows_blur = 15
shadows_position_x = 0
shadows_position_y = 0

border_radius=6
no_radius_when_single=0
focused_opacity=1.0
unfocused_opacity=1.0

dim_enable=0

# Animations
animations=1
layer_animations=1
animation_type_open=slide
animation_type_close=slide
animation_fade_in=1
animation_fade_out=1
tag_animation_direction=1
zoom_initial_ratio=0.4
zoom_end_ratio=0.8
fade_in_begin_opacity=0.5
fade_out_begin_opacity=0.8
animation_duration_move=500
animation_duration_open=400
animation_duration_tag=350
animation_duration_close=800
animation_duration_focus=0
animation_curve_open=0.46,1.0,0.29,1
animation_curve_move=0.46,1.0,0.29,1
animation_curve_tag=0.46,1.0,0.29,1
animation_curve_close=0.08,0.92,0,1
animation_curve_focus=0.46,1.0,0.29,1
animation_curve_opacity_fade_out=0.5,0.5,0.5,0.5
animation_curve_opacity_fade_in=0.46,1.0,0.29,1

# Scroller Layout Setting
scroller_structs=20
scroller_default_proportion=0.8
scroller_focus_center=0
scroller_prefer_center=0
edge_scroller_pointer_focus=1
edge_scroller_focus_allow_speed=0.0
scroller_default_proportion_single=1.0
scroller_proportion_preset=0.5,0.8,1.0

# Master-Stack Layout Setting
new_is_master=1
default_master_factor=0.55
default_master_count=1
tag_num=10
smart_gaps=0

# Dwindle Layout Setting
dwindle_smart_split=0
dwindle_drop_simple_split=1
dwindle_manual_split=0
dwindle_horizontal_split=1
dwindle_vertical_split=1
dwindle_preserve_split=0

# Monocle Layout Setting
monocle_tab_mode=1
monocle_no_border=0
monocle_no_gap=0
monocle_no_radius=0

# Deck Layout Setting
deck_tab_mode=1

# Overview Setting
hotarea_size=10
enable_hotarea=0
hotarea_disable_on_fullscreen=1
overview_gap_inner=5
overview_gap_outer=30
overcircle_center_ratio=0.5
title_message_bar_height=52
title_message_bar_gap=20

# Misc
no_border_when_single=0
axis_bind_apply_timeout=100
focus_on_activate=1
idle_inhibit_ignore_visible=0
idle_inhibit_when_fullscreen=0
sloppy_focus=1
warp_cursor=0
focus_cross_monitor=0
focus_direction_only_zone_overlap=1
focus_cross_tag=0
enable_floating_snap=0
snap_distance=30
float_full_to_top=0
cursor_size=24
drag_tile_to_tile=1
drag_tile_small=1

# keyboard
repeat_rate=40
repeat_delay=250
numlock_on=1
xkb_rules_layout=us,ru
xkb_rules_variant=,
xkb_rules_options=compose:caps,shift:both_capslock_cancel,grp:win_space_toggle

# Trackpad
disable_trackpad=0
tap_to_click=1
tap_and_drag=1
drag_lock=1
trackpad_natural_scrolling=1
trackpad_disable_while_typing=1
trackpad_left_handed=0
trackpad_middle_button_emulation=0
swipe_min_threshold=1

# mouse
mouse_natural_scrolling=0

# Appearance
gap_inner_horizontal=5
gap_inner_vertical=5
gap_outer_horizontal=10
gap_outer_vertical=10
scratchpad_width_ratio=0.8
scratchpad_height_ratio=0.9
border_px=4
source=~/.config/mango/colors.conf

# Workspace layouts
tag_rule=id:1,layout_name:scroller
tag_rule=id:2,layout_name:scroller
tag_rule=id:3,layout_name:scroller
tag_rule=id:4,layout_name:scroller
tag_rule=id:5,layout_name:scroller
tag_rule=id:6,layout_name:scroller
tag_rule=id:7,layout_name:scroller
tag_rule=id:8,layout_name:scroller
tag_rule=id:9,layout_name:scroller
tag_rule=id:10,layout_name:scroller

# Keybindings
bind=ALT,Tab,focusstack,next
bind=SHIFT+ALT,Tab,focusstack,prev

bind=CTRL+ALT,Tab,focusmon,next
bind=SHIFT+CTRL+ALT,Tab,focusmon,prev

bindl=ALT,XF86AudioLowerVolume,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 1%-
bindl=ALT,XF86AudioRaiseVolume,spawn,wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 1%+

# Application launchers
bind=SUPER,d,spawn,fuzzel
bind=SUPER,Return,spawn,alacritty
bind=SUPER+SHIFT,b,spawn,helium
bind=SUPER+SHIFT,f,spawn,xdg-open .
bind=SUPER+SHIFT,n,spawn,alacritty -e nvim
bind=SUPER+SHIFT,Return,spawn,firefox
bind=SUPER+SHIFT+ALT,b,spawn,firefox --private-window

# Switch to workspace
bind=SUPER,code:19,view,10,0
bind=SUPER,code:10,view,1,0
bind=SUPER,code:11,view,2,0
bind=SUPER,code:12,view,3,0
bind=SUPER,code:13,view,4,0
bind=SUPER,code:14,view,5,0
bind=SUPER,code:15,view,6,0
bind=SUPER,code:16,view,7,0
bind=SUPER,code:17,view,8,0
bind=SUPER,code:18,view,9,0

bind=SUPER,comma,spawn,makoctl dismiss

bind=SUPER,Down,focusdir,down
bind=SUPER,Escape,quit
bind=SUPER,code:21,resizewin,+100,+0
bind=SUPER,f,togglemaximizescreen
bind=SUPER,j,dwindle_toggle_current_split
bind=SUPER,l,switch_layout
bind=SUPER,Left,focusdir,left
mousebind=SUPER,btn_left,moveresize,curmove
bind=SUPER,code:20,resizewin,-100,+0
axisbind=SUPER,DOWN,focusdir,right
axisbind=SUPER,UP,focusdir,left
bind=SUPER,q,killclient
bind=SUPER,Right,focusdir,right
mousebind=SUPER,btn_right,moveresize,curresize
bind=SUPER,s,toggle_special_tag
bind=SUPER,t,togglefloating
bind=SUPER,Tab,viewtoright,0
bind=SUPER,Up,focusdir,up
bind=SUPER+ALT,comma,spawn,makoctl invoke
bind=SUPER+ALT,Down,groupjoin,down
bind=SUPER+ALT,code:21,resizewin,+25,+0
bind=SUPER+ALT,g,groupleave
bind=SUPER+ALT,Left,groupjoin,left
bind=SUPER+ALT,code:20,resizewin,-25,+0
axisbind=SUPER+ALT,DOWN,groupfocus,next
axisbind=SUPER+ALT,UP,groupfocus,prev
bind=SUPER+ALT,Right,groupjoin,right
bind=SUPER+ALT,s,tag_special_silent
bind=SUPER+ALT,Tab,groupfocus,next
bind=SUPER+ALT,Up,groupjoin,up
bind=SUPER+CTRL,comma,spawn,makoctl mode -t do-not-disturb
bind=SUPER+CTRL,code:21,resizewin,+300,+0
bind=SUPER+CTRL,Left,groupfocus,prev
bind=SUPER+CTRL,code:20,resizewin,-300,+0
bind=SUPER+CTRL,Right,groupfocus,next
bind=SUPER+CTRL,Tab,view,0,0

# Move window to workspace
bind=SUPER+SHIFT,code:19,tag,10,0
bind=SUPER+SHIFT,code:10,tag,1,0
bind=SUPER+SHIFT,code:11,tag,2,0
bind=SUPER+SHIFT,code:12,tag,3,0
bind=SUPER+SHIFT,code:13,tag,4,0
bind=SUPER+SHIFT,code:14,tag,5,0
bind=SUPER+SHIFT,code:15,tag,6,0
bind=SUPER+SHIFT,code:16,tag,7,0
bind=SUPER+SHIFT,code:17,tag,8,0
bind=SUPER+SHIFT,code:18,tag,9,0
bind=SUPER+SHIFT,BackSpace,togglegaps
bind=SUPER+SHIFT,comma,spawn,makoctl dismiss --all
bind=SUPER+SHIFT,Down,exchange_client,down
bind=SUPER+SHIFT,code:21,resizewin,+0,+100
bind=SUPER+SHIFT,Left,exchange_client,left
bind=SUPER+SHIFT,code:20,resizewin,+0,-100
bind=SUPER+SHIFT,Right,exchange_client,right
bind=SUPER+SHIFT,space,spawn,pkill -SIGUSR1 waybar
bind=SUPER+SHIFT,Tab,viewtoleft,0
bind=SUPER+SHIFT,Up,exchange_client,up

# Move window silently to workspace
bind=SUPER+SHIFT+ALT,code:19,tagsilent,10
bind=SUPER+SHIFT+ALT,code:10,tagsilent,1
bind=SUPER+SHIFT+ALT,code:11,tagsilent,2
bind=SUPER+SHIFT+ALT,code:12,tagsilent,3
bind=SUPER+SHIFT+ALT,code:13,tagsilent,4
bind=SUPER+SHIFT+ALT,code:14,tagsilent,5
bind=SUPER+SHIFT+ALT,code:15,tagsilent,6
bind=SUPER+SHIFT+ALT,code:16,tagsilent,7
bind=SUPER+SHIFT+ALT,code:17,tagsilent,8
bind=SUPER+SHIFT+ALT,code:18,tagsilent,9
bind=SUPER+SHIFT+ALT,code:21,resizewin,+0,+25
bind=SUPER+SHIFT+ALT,code:20,resizewin,+0,-25
bind=SUPER+SHIFT+ALT,Tab,groupfocus,prev
bind=SUPER+SHIFT+CTRL,code:21,resizewin,+0,+300
bind=SUPER+SHIFT+CTRL,code:20,resizewin,+0,-300

# Media and touchpad keys
bindl=NONE,XF86AudioLowerVolume,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl=NONE,XF86AudioMicMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindl=NONE,XF86AudioMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl=NONE,XF86AudioRaiseVolume,spawn,wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindl=NONE,XF86TouchpadToggle,toggle_trackpad_enable

# Maintenance
bind=SUPER+SHIFT,r,reload_config

# layer rule
layer_rule=animation_type_open:zoom,layer_name:fuzzel
layer_rule=animation_type_close:zoom,layer_name:fuzzel
